name: update

on:
  schedule:
    - cron: "17 * * * *"               # 毎時
    - cron: "*/20 0-12 * * 5,6,0"      # 金土日の日本時間 9〜21時は20分ごと
    - cron: "0 3 1 * *"                # 毎月1日：自動実行が止められないよう空コミット
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "過去の試合結果を全シーズン取り直す"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push

  build:
    if: github.event.schedule != '0 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: totodata-${{ github.run_id }}
          restore-keys: totodata-

      - name: build site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '0' }}
          TZ: Asia/Tokyo
        run: python build_site.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: totodata-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
