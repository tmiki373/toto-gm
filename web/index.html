<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>toto予想</title>
<style>
:root{
  --bg:#f3f5f9;--bg2:#e8ecf3;--card:#fff;--fg:#0f172a;--sub:#64748b;--line:#e2e8f0;
  --acc:#2563eb;--accbg:#dbeafe;
  --c1:#e11d48;--c0:#94a3b8;--c2:#2563eb;--val:#ea580c;--ok:#16a34a;--ng:#dc2626;
  --g0:#94a3b8;--g1:#22c55e;--g2:#f59e0b;--g3:#ef4444;
  --r:16px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b1120;--bg2:#141c2f;--card:#121a2b;--fg:#e5e9f2;--sub:#8b97ad;--line:#1f2a40;
  --acc:#3b82f6;--accbg:#1e2b4a;--c0:#64748b;--shadow:none}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.top .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:grid;place-items:center;font-size:17px}
.top h1{font-size:1.02rem;margin:0;line-height:1.2}
.top small{display:block;font-size:.7rem;opacity:.75}
.top .sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;text-decoration:none}
.fresh{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}

main{max-width:760px;margin:0 auto;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:10px 0}
.warn{display:flex;gap:8px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:12px;padding:9px 11px;font-size:.8rem;margin:8px 0}
@media(prefers-color-scheme:dark){.warn{background:#2a1a0e;color:#fdba74;border-color:#7c2d12}}

.hero{background:linear-gradient(140deg,#1e3a8a,#2563eb 55%,#0891b2);color:#fff;border:0}
.hero.rv{background:linear-gradient(140deg,#312e81,#6d28d9 60%,#a21caf)}
.hero .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero h2{margin:0;font-size:1.15rem}
.dl{font-size:.75rem;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;white-space:nowrap}
.dl.soon{background:#f97316}.dl.over{background:rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:1.05rem;line-height:1.25}
.stat span{font-size:.68rem;opacity:.85}
.htext{font-size:.8rem;line-height:1.6;background:rgba(0,0,0,.18);border-radius:10px;padding:9px 10px}
.row{display:flex;gap:8px;align-items:center}
.hbtn{flex:1;border:0;border-radius:10px;padding:9px 4px;background:rgba(255,255,255,.95);color:#1e3a8a;font-weight:700;font-size:.82rem}
.hbtn.ghost{background:rgba(255,255,255,.14);color:#fff}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;background:rgba(0,0,0,.2);border-radius:12px;padding:8px}
.tc{background:rgba(255,255,255,.1);border-radius:9px;padding:4px 2px 6px;text-align:center}
.tc span{display:block;font-size:.64rem;opacity:.8;margin-bottom:2px}
.tc div{display:flex;gap:2px;justify-content:center}
.tc b{min-width:17px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:.82rem;color:#fff;padding:0 3px;font-weight:800}
.tc.multi{background:rgba(250,204,21,.2);box-shadow:inset 0 0 0 1.5px rgba(250,204,21,.75)}
.tleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.68rem;opacity:.9;margin-top:6px}
.tleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px}

.ctl{display:grid;gap:10px}
.ctl label{font-size:.72rem;color:var(--sub);display:block;margin-bottom:4px}
.seg{display:flex;background:var(--bg2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:9px;font-size:.8rem;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.ktabs{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:15;background:var(--bg);padding:8px 0 4px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ktabs::-webkit-scrollbar{display:none}
.ktabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.82rem}
.ktabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}

.m{padding:12px 14px}
.m.hit{border-left:4px solid var(--ok)}.m.miss{border-left:4px solid var(--ng)}.m.wait{border-left:4px solid var(--line)}
.mh{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--sub);flex-wrap:wrap}
.no{min-width:24px;height:22px;border-radius:7px;background:var(--bg2);color:var(--fg);font-weight:800;display:grid;place-items:center;font-size:.78rem;padding:0 5px}
.badge{font-size:.66rem;font-weight:700;border-radius:6px;padding:2px 6px}
.b-solid{background:#dcfce7;color:#166534}.b-close{background:#fef3c7;color:#92400e}.b-val{background:#ffedd5;color:#c2410c}
.b-ok{background:#dcfce7;color:#166534}.b-ng{background:#fee2e2;color:#991b1b}.b-gray{background:var(--bg2);color:var(--sub)}
.b-fix{background:#ede9fe;color:#5b21b6}.b-mk{background:#cffafe;color:#155e75}
@media(prefers-color-scheme:dark){.b-solid,.b-ok{background:#14321f;color:#86efac}.b-close{background:#3a2c0b;color:#fcd34d}.b-val{background:#3b1d0b;color:#fdba74}.b-ng{background:#3b1414;color:#fca5a5}.b-fix{background:#2e1f52;color:#c4b5fd}.b-mk{background:#0e3440;color:#67e8f9}}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin:8px 0 10px}
.tm{font-weight:700;font-size:.88rem;line-height:1.25;overflow-wrap:anywhere}
.tm small{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:3px;font-weight:500;font-size:.68rem;color:var(--sub)}
.tm.r{text-align:right}.tm.r small{justify-content:flex-end}
.picks{display:flex;gap:4px;justify-content:center}
.pk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.95rem}
.score{font-size:1.35rem;font-weight:800;text-align:center;line-height:1.1}
.score small{display:block;font-size:.62rem;color:var(--sub);font-weight:600}
.bar{display:flex;height:24px;border-radius:8px;overflow:hidden;font-size:.72rem;font-weight:700;color:#fff}
.bar div{display:flex;align-items:center;justify-content:center;white-space:nowrap;transition:width .3s}
.bar div.act{box-shadow:inset 0 0 0 3px #facc15}
.vbar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:4px;opacity:.45}
.mbar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:3px;opacity:.85;outline:1px dashed rgba(14,116,144,.7);outline-offset:1px}
.legend3{display:flex;justify-content:space-between;font-size:.68rem;color:var(--sub);margin-top:5px;gap:4px}
.legend3 .val{color:var(--val);font-weight:700}
.mline{display:flex;justify-content:space-between;font-size:.66rem;color:#0e7490;margin-top:2px}
@media(prefers-color-scheme:dark){.mline{color:#67e8f9}}
.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none;font-size:.78rem}
.m.open .more{display:block}
.kv{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px 10px;align-items:center}
.kv dt{color:var(--sub);font-size:.72rem}.kv dd{margin:0}.kv dd.r{text-align:right}
.form{display:inline-flex;gap:2px}
.form i{width:15px;height:15px;border-radius:4px;display:inline-grid;place-items:center;font-style:normal;font-size:.6rem;font-weight:800;color:#fff}
.fW{background:var(--ok)}.fD{background:var(--c0)}.fL{background:var(--ng)}
.chev{margin-left:auto;transition:transform .2s;opacity:.5}
.m.open .chev{transform:rotate(180deg)}
.sc{display:flex;gap:6px;flex-wrap:wrap}
.sc span{background:var(--bg2);border-radius:6px;padding:2px 7px;font-size:.72rem}
.note{font-size:.72rem;color:var(--ng);margin-top:6px}
.side{font-size:.72rem;color:var(--sub);margin:8px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cmt{margin-top:10px;background:var(--bg2);border-radius:10px;padding:9px 11px;font-size:.78rem;line-height:1.6}
.cmt b{display:block;font-size:.72rem;color:var(--ng);margin-bottom:2px}
.cmt ul{margin:0;padding-left:1.1em}
.fix{margin-top:8px;background:var(--accbg);border-radius:10px;padding:8px 10px;font-size:.74rem;line-height:1.6}
.fix b{color:var(--acc)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}

.adv .advsum{font-size:.82rem;line-height:1.7;margin:4px 0 8px}
.advlist{list-style:none;margin:0;padding:0}
.advlist li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:.82rem;line-height:1.5}
.advno{width:26px;height:22px;border-radius:7px;background:var(--bg2);font-weight:800;display:grid;place-items:center;font-size:.72rem}
.advpk{color:var(--acc);font-size:.95rem}
.advlist small{color:var(--sub);font-size:.74rem}

.lesson h3{display:flex;align-items:center;gap:6px}
.step{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:.8rem;line-height:1.55}
.step:first-of-type{border-top:0}
.sn{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.75rem}
.chk{background:var(--bg2);border-radius:9px;padding:7px 9px;margin:5px 0;font-size:.76rem}
.chk b{display:block}
.chk span{display:block;color:var(--sub)}
.chk em{display:block;font-style:normal;font-weight:700;color:var(--acc);margin-top:2px}

.sheet{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:.8rem}
.sheet td{padding:4px 3px}
.sheet .t{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{width:38px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.85rem;margin:auto;border:1.5px solid var(--line);color:var(--sub);position:relative}
.cell.sel{color:#fff;border-color:transparent}
.cell small{position:absolute;bottom:-1px;font-size:.52rem;font-weight:600;opacity:.85}

h3{font-size:.95rem;margin:0 0 4px}
.desc{font-size:.74rem;color:var(--sub);margin:0 0 10px}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th{font-size:.68rem;color:var(--sub);font-weight:600;text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
tr.best td{font-weight:800;color:var(--acc)}
.mini{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;min-width:44px}
.mini i{display:block;height:100%;border-radius:3px}
.cal{display:grid;grid-template-columns:70px 1fr 48px;gap:6px 8px;align-items:center;font-size:.75rem}
.calbar{position:relative;height:16px;background:var(--bg2);border-radius:5px}
.calbar i{position:absolute;top:0;bottom:0;left:0;background:var(--acc);opacity:.35;border-radius:5px}
.calbar b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--val);border-radius:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.78rem}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
input.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--fg);font-size:.9rem;margin-bottom:6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:54px;margin-top:6px}
.spark div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;opacity:.75;min-height:2px}
.sparkx{display:flex;justify-content:space-between;font-size:.62rem;color:var(--sub)}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status div{background:var(--bg2);border-radius:12px;padding:9px 11px}
.status b{display:block;font-size:1rem}
.status span{font-size:.68rem;color:var(--sub)}
.prog{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:#0891b2}
.feat{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border:0}
.feat b{font-size:.85rem}.feat p{grid-column:1/-1;margin:0;font-size:.72rem;color:var(--sub)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.78rem}
.hist li:last-child{border:0}
.hist small{grid-column:2;color:var(--sub);font-size:.66rem}
.track{display:flex;align-items:flex-end;gap:4px;height:80px}
.track div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.58rem;color:var(--sub);height:100%}
.track i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--acc)}
pre.log{white-space:pre-wrap;font-size:.7rem;color:var(--sub);max-height:260px;overflow:auto}

/* ---------- 購入記録 ---------- */
.btable{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:.8rem}
.btable td{padding:2px 3px;vertical-align:middle}
.btable .t{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{width:40px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:800;color:var(--sub)}
.bt.on{color:#fff;border-color:transparent}
.bsum{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.88rem}
.brow{display:flex;gap:6px;flex-wrap:wrap}
.brow button{flex:1;min-width:30%;padding:10px 6px;border-radius:10px;border:0;background:var(--bg2);font-weight:700;font-size:.8rem}
.brow button.pri{background:var(--acc);color:#fff}
.brow button:disabled{opacity:.4}
input.memo{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--fg);margin:6px 0;font-size:.9rem}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px;margin:8px 0}
.bc{border-radius:8px;padding:3px 2px 4px;text-align:center;background:var(--bg2);border:2px solid transparent}
.bc span{display:block;font-size:.6rem;color:var(--sub)}
.bc b{font-size:.85rem}
.bc small{display:block;font-size:.58rem;color:var(--sub)}
.bc.hit{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.bc.miss{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 15%,transparent)}
.tk{border-top:1px solid var(--line);padding:10px 0}
.tk:first-of-type{border-top:0;padding-top:0}
.tkh{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem}
.tkf{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.74rem;color:var(--sub)}
input.pay{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--fg)}
.lnk{border:0;background:none;color:var(--sub);font-size:.72rem;text-decoration:underline;padding:2px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.6rem;color:var(--sub);padding:4px 0;white-space:nowrap}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc);font-weight:700}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility .25s;max-width:760px;margin:auto}
.drawer.show{transform:none;visibility:visible}.mask.show{display:block}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.field{margin:14px 0}
.field label{font-size:.78rem;color:var(--sub);display:block;margin-bottom:6px}
input[type=number],input[type=password]{width:100%;padding:11px 12px;font-size:1rem;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--fg)}
input.pay[type=number]{width:110px;padding:6px 8px;font-size:.85rem;border-radius:8px}
input[type=range]{width:100%;accent-color:var(--acc)}
.switch{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:.95rem}
.btn.sub{background:var(--bg2);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:.82rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0f172a,#1e3a8a)}
#login .box{width:100%;max-width:340px;color:#fff;text-align:center}
#login .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:grid;place-items:center;font-size:34px}
#login input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;text-align:center;margin:18px 0 10px}
#login label{font-size:.8rem;opacity:.85}
#lerr{color:#fca5a5;font-size:.8rem;min-height:1.2em}
.foot{font-size:.68rem;color:var(--sub);text-align:center;margin:18px 0 6px}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div class="logo">⚽</div>
    <div style="font-weight:800;font-size:1.3rem">toto予想</div>
    <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
    <label><input id="remember" type="checkbox" checked> この端末で記憶する</label>
    <div style="height:12px"></div>
    <button class="btn" id="go">開く</button>
    <p id="lerr"></p>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="logo">⚽</div>
    <div><h1>toto予想</h1><small id="upd"></small></div>
    <div class="sp"></div>
    <a class="ibtn" id="refresh" target="_blank" title="今すぐ更新" aria-label="今すぐ更新">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></a>
    <button class="ibtn" id="openSet" aria-label="設定">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>

    <button data-v="sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h2M14 8h2M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>マーク</button>
    <button data-v="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>購入</button>
    <button data-v="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>振り返り</button>
    <button data-v="teams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>チーム</button>
    <button data-v="model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>精度・学習</button>

<div class="drawer" id="drawer">

  <div class="field switch">詳細を最初から開く<input id="expand" type="checkbox"></div>

<script>
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D = null, COPY_TEXT = "";
const S = Object.assign({view:"pred", kind:0, rkind:0, budget:1000, alpha:0, detail:false, expand:false, lg:"all", q:"", missOnly:false},
  JSON.parse(localStorage.getItem("toto_state") || "{}"));
const save = () => localStorage.setItem("toto_state", JSON.stringify(S));
const open = new Set();

async function decrypt(enc, pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(enc.salt), iterations:enc.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(enc.iv)}, key, b64(enc.ct))));
}
async function start(pw) {
  const enc = await (await fetch("data.json?t=" + Date.now(), {cache:"no-store"})).json();
  D = await decrypt(enc, pw);
  if ($("#remember").checked) localStorage.setItem("toto_pw", pw);
  $("#login").hidden = true; $("#app").hidden = false;
  fetch("config.json", {cache:"no-store"}).then(r => r.json()).then(c => {
    if (c.repo) $("#refresh").href = `https://github.com/${c.repo}/actions/workflows/update.yml`; }).catch(() => {});
  render();
}
$("#go").onclick = () => { $("#lerr").textContent = "確認中…";
  start($("#pw").value).catch(() => { $("#lerr").textContent = "パスワードが違うか、データを読み込めませんでした"; }); };
$("#pw").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
const saved = localStorage.getItem("toto_pw");
if (saved) start(saved).catch(() => localStorage.removeItem("toto_pw"));

const drawer = on => { $("#drawer").classList.toggle("show", on); $("#mask").classList.toggle("show", on); };
$("#openSet").onclick = () => { $("#budget").value = S.budget; $("#alpha").value = S.alpha; $("#aval").textContent = (+S.alpha).toFixed(1);
  $("#detail").checked = S.detail; $("#expand").checked = S.expand; drawer(true); };
$("#closeSet").onclick = $("#mask").onclick = () => drawer(false);
$("#budget").oninput = e => { S.budget = Math.max(100, +e.target.value || 100); save(); render(); };
$("#alpha").oninput = e => { S.alpha = +e.target.value; $("#aval").textContent = S.alpha.toFixed(1); save(); render(); };
$("#detail").onchange = e => { S.detail = e.target.checked; save(); render(); };
$("#expand").onchange = e => { S.expand = e.target.checked; save(); render(); };
$("#logout").onclick = () => { localStorage.removeItem("toto_pw"); location.reload(); };
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => { S.view = b.dataset.v; save(); render(); scrollTo(0, 0); });
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); }

// ================= 買い目 =================
const OUT3 = ["1","0","2"], OUT4 = ["0","1","2","3"];
const sum = (a, idx) => idx.reduce((s, k) => s + a[k], 0);
function slotsOf(K) {
  if (K.kind === "totoGOAL3") return K.rows.flatMap(r => [
    {p:r.g_h, v:r.v_h, m:r.m_g_h, lab:OUT4, key:r.no + "H", r}, {p:r.g_a, v:r.v_a, m:r.m_g_a, lab:OUT4, key:r.no + "A", r}]);
  return K.rows.map(r => ({p:r.p, v:r.v, m:r.m, lab:OUT3, key:String(r.no), r}));
}
function buildTicket(slots, units, alpha) {
  const score = (s, idx) => { const P = sum(s.p, idx);
    if (alpha && s.v) { const V = Math.max(sum(s.v, idx), 1e-3); return Math.log(P) + alpha * Math.log(P / V); }
    return Math.log(P); };
  const picks = slots.map(s => { let b = 0; for (let k = 1; k < s.p.length; k++) if (score(s, [k]) > score(s, [b])) b = k; return [b]; });
  for (;;) {
    const cost = picks.reduce((c, p) => c * p.length, 1);
    let best = null, bg = 0;
    slots.forEach((s, i) => { const k = picks[i].length;
      if (k === s.p.length || Math.floor(cost / k) * (k + 1) > units) return;
      const c0 = score(s, picks[i]);
      for (let c = 0; c < s.p.length; c++) { if (picks[i].includes(c)) continue;
        const g = (score(s, [...picks[i], c]) - c0) / Math.log((k + 1) / k);
        if (g > bg) { bg = g; best = [i, c]; } } });
    if (!best) break;
    picks[best[0]].push(best[1]);
  }
  const hit = slots.reduce((h, s, i) => h * sum(s.p, picks[i]), 1);
  const hasV = slots.every(s => s.v);
  const share = hasV ? slots.reduce((h, s, i) => h * picks[i].reduce((a, k) => a + s.p[k] * s.v[k], 0) / sum(s.p, picks[i]), 1) : null;
  return {picks: picks.map(p => [...p].sort((a, b) => a - b)), units: picks.reduce((c, p) => c * p.length, 1), hit, share};
}

// ================= ヘルパー =================
const C3 = ["var(--c1)","var(--c0)","var(--c2)"], C4 = ["var(--g0)","var(--g1)","var(--g2)","var(--g3)"];
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const oneIn = x => { if (!x) return "-"; const n = 1 / x;
  if (n < 1.05) return "ほぼ確実"; if (n < 10) return "1/" + n.toFixed(1);
  if (n < 1e4) return "1/" + Math.round(n).toLocaleString(); if (n < 1e8) return "1/" + (n / 1e4).toFixed(n < 1e5 ? 1 : 0) + "万";
  return "1/" + (n / 1e8).toFixed(1) + "億"; };
function ago(iso) { const m = (Date.now() - new Date(iso)) / 6e4;
  if (m < 1) return "たった今"; if (m < 60) return Math.round(m) + "分前"; if (m < 1440) return Math.round(m / 60) + "時間前"; return Math.round(m / 1440) + "日前"; }
function left(iso) { if (!iso) return null; const ms = new Date(iso) - Date.now();
  if (ms <= 0) return {t:"販売終了", cls:"over"};
  const h = ms / 36e5, d = Math.floor(h / 24);
  const P = Object.fromEntries(new Intl.DateTimeFormat("ja-JP", {timeZone:"Asia/Tokyo", month:"numeric", day:"numeric",
    weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false}).formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return {t:`締切 ${P.month}/${P.day}(${P.weekday}) ${P.hour}:${P.minute}・あと${d ? d + "日" : ""}${Math.floor(h % 24)}時間${d ? "" : Math.floor(ms / 6e4 % 60) + "分"}`, cls: h < 6 ? "soon" : ""}; }
function bar(p, labels, colors, act) {
  return `<div class="bar">` + p.map((x, i) => `<div class="${i === act ? "act" : ""}" style="width:${Math.max(x * 100, .6)}%;background:${colors[i]}">${x >= .13 ? labels[i] + " " + pct(x) : ""}</div>`).join("") + "</div>"; }
const vbar = (v, colors) => v ? `<div class="vbar">` + v.map((x, i) => `<div style="width:${x * 100}%;background:${colors[i]}"></div>`).join("") + "</div>" : "";
const mbar = (m, colors) => m ? `<div class="mbar">` + m.map((x, i) => `<div style="width:${x * 100}%;background:${colors[i]}"></div>`).join("") + "</div>" : "";
const formHtml = f => `<span class="form">${[...(f.marks || "")].map(c => `<i class="f${c}">${{W:"○",D:"△",L:"●"}[c]}</i>`).join("") || "-"}</span>`;
const tinfo = t => t && t.lg ? `${t.lg} ${t.rank}位` : "";
const pickColor = lab => ({"1":"var(--c1)","0":"#64748b","2":"var(--c2)"})[lab] || "var(--acc)";
const md = s => s ? s.slice(5).replace("-", "/") : "";
const sgn = x => (x > 0 ? "+" : "") + x.toFixed(1);
const amax = a => a.indexOf(Math.max(...a));
function reasonText(rs) {
  return (rs || []).map(r => { const k = r.d.map(Math.abs).indexOf(Math.max(...r.d.map(Math.abs)));
    return `${esc(r.name)}：${OUT3[k]}を${sgn(r.d[k])}pt`; });
}
function standText(st) {
  if (!st || !st.n) return "-";
  return `${st.rank}位/${st.n}` + (st.prog >= .5 ? (st.stake ? "・懸かっている" : "・消化試合") : "");
}

function header() {
  const fresh = D.lag <= 10 ? "var(--ok)" : D.lag <= 21 ? "var(--g2)" : "var(--ng)";
  $("#upd").innerHTML = `<span class="fresh" style="background:${fresh}"></span>更新 ${ago(D.updated)}・結果 ${D.res_to.slice(5)}まで`;
}

function render() {
  if (!D) return;
  header();
  syncResults();
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  let h = D.errors.map(e => `<div class="warn">⚠️<span>${esc(e)}</span></div>`).join("");
  if (S.view === "pred" || S.view === "sheet") {
    S.kind = Math.min(S.kind, D.kinds.length - 1);
    h += `<div class="ktabs">` + D.kinds.map((k, i) => `<button class="${i === S.kind ? "on" : ""}" data-k="${i}">${k.kind.replace("mini toto-", "mini ")}</button>`).join("") + `</div>`;
    const K = D.kinds[S.kind], slots = slotsOf(K), T = buildTicket(slots, Math.floor(S.budget / 100), S.alpha);
    h += hero(K, slots, T) + appliedCard(K) + adviceCard(K, slots, T) + (S.view === "pred" ? predView(K, slots, T) : sheetView(K, slots, T));
  } else if (S.view === "buy") h += buyView();
  else if (S.view === "review") h += reviewView();
  else if (S.view === "teams") h += teamsView();
  else h += modelView();
  h += `<p class="foot">確率は過去データからの推定で、的中を保証するものではありません。<br>19歳未満の方は購入できません。</p>`;
  $("#main").innerHTML = h;
  bind();
}

// ================= 予想 =================
function ticketGrid(K, slots, T) {
  const isG = K.kind === "totoGOAL3";
  const lab = (s, k) => s.lab[k] === "3" ? "3+" : s.lab[k];
  const col = (s, k) => isG ? C4[k] : pickColor(s.lab[k]);
  COPY_TEXT = `第${K.round}回 ${K.kind}\n` + slots.map((s, i) => `${s.key}: ${T.picks[i].map(k => lab(s, k)).join("")}`).join("\n");
  const cells = slots.map((s, i) => `<div class="tc ${T.picks[i].length > 1 ? "multi" : ""}"><span>${isG ? s.key : "No." + s.key}</span>
    <div>${T.picks[i].map(k => `<b style="background:${col(s, k)}">${lab(s, k)}</b>`).join("")}</div></div>`).join("");
  const leg = isG
    ? `<span>数字＝そのチームの得点（3+は3点以上）</span><span>黄色の枠＝複数選択</span>`
    : `<span><i style="background:var(--c1)"></i>1 ホーム勝ち</span><span><i style="background:#64748b"></i>0 引き分け</span><span><i style="background:var(--c2)"></i>2 アウェイ勝ち</span><span>黄色の枠＝ダブル・トリプル</span>`;
  return `<div class="tgrid">${cells}</div><div class="tleg">${leg}</div>`;
}

function hero(K, slots, T) {
  LAST_T = T;
  const dl = left(K.deadline);
  const strat = [[0,"的中重視"],[.4,"バランス"],[.8,"妙味重視"]];
  const nb = BUY.filter(t => t.round === K.round && t.kind === K.kind).length;
  return `<div class="card hero">
    <div class="ttl"><h2>第${K.round}回 ${K.kind}</h2>${dl ? `<span class="dl ${dl.cls}">${dl.t}</span>` : ""}</div>
    <div class="stats num">
      <div class="stat"><b>${T.units}口</b><span>${(T.units * 100).toLocaleString()}円</span></div>
      <div class="stat"><b>${oneIn(T.hit)}</b><span>的中確率 ${pct(T.hit, T.hit < .01 ? 3 : 1)}</span></div>
      <div class="stat"><b>${T.share !== null ? oneIn(T.share) : "-"}</b><span>同じく当たる人</span></div>
    </div>
    ${ticketGrid(K, slots, T)}
    <div class="row" style="margin-top:10px">
      <button class="hbtn" id="copy">買い目をコピー</button>
      <button class="hbtn ghost" id="toSheet">${S.view === "sheet" ? "カード表示" : "マークシート"}</button>
      <button class="hbtn ghost" id="toBuy">購入を記録${nb ? `（${nb}）` : ""}</button>
    </div>
  </div>
  <div class="card ctl">
    <div><label>予算（1種類あたり）</label><div class="seg" id="bseg">${[100,300,1000,3000,10000].map(b =>
      `<button data-b="${b}" class="${S.budget === b ? "on" : ""}">${b >= 1000 ? b / 1000 + "千" : b}円</button>`).join("")}</div></div>
    <div><label>買い方の方針</label><div class="seg" id="aseg">${strat.map(([a, t]) =>
      `<button data-a="${a}" class="${Math.abs(S.alpha - a) < .05 ? "on" : ""}">${t}</button>`).join("")}</div></div>
  </div>`;
}

// 外れから学んだ補正と、直前情報（市場・出場停止）の反映
function appliedCard(K) {
  if (K.kind === "totoGOAL3") return "";
  const L = D.learning, ls = (L.lessons || [])[0], mk = L.market || {};
  const rows = K.rows.filter(r => r.reasons && r.reasons.length);
  const withM = K.rows.filter(r => r.m).length;
  const warn = K.rows.filter(r => r.div != null && r.div >= D.diverge);
  const susp = K.rows.filter(r => r.susp_h || r.susp_a);
  let h = `<div class="card"><h3>直前情報と学習の反映</h3>`;
  h += `<p class="desc">WINNERのオッズ（市場）: ${withM}/${K.rows.length}試合で取得・` +
       (mk.a ? `予想に重み${mk.a}で反映中` : `記録中（${mk.n}/${mk.need}試合で効果を検証して反映）`) +
       `。出場停止あり: ${susp.length}試合。${ls ? `第${ls.round}回の振り返り（本命 ${ls.hits}/${ls.known}）を含む累積データで補正を検証済み。` : ""}</p>`;
  if (warn.length) h += `<div class="side" style="align-items:flex-start"><span class="badge b-ng">荒れ注意</span><span style="text-align:right">${warn.map(r => {
      const a = amax(r.p), b = amax(r.m); return `No.${r.no} ${esc(r.home)}-${esc(r.away)}：予想は${OUT3[a]}、市場は${OUT3[b]}${a === b ? "（確率に差）" : ""}`; }).join("<br>")}</span></div>`;
  h += rows.slice(0, 13).map(r => `<div class="side" style="align-items:flex-start"><span><b style="color:var(--fg)">No.${r.no}</b> ${esc(r.home)}-${esc(r.away)}</span>
    <span style="text-align:right">${reasonText(r.reasons).slice(0, 2).join("<br>")}</span></div>`).join("");
  if (!rows.length && !warn.length) h += `<p class="desc" style="margin:0">今回の対象試合では、補正で大きく動いた試合はありません。</p>`;
  return h + `</div>`;
}

function adviceCard(K, slots, T) {
  const isG = K.kind === "totoGOAL3";
  const lab = k => isG ? (k === 3 ? "3+" : String(k)) : OUT3[k];
  const name = s => isG ? `${s.key.endsWith("H") ? s.r.home : s.r.away}の得点` : `${s.r.home}-${s.r.away}`;
  const items = slots.map((s, i) => {
    const p = s.p, sel = T.picks[i], cov = sel.reduce((a, k) => a + p[k], 0);
    const order = p.map((x, k) => [x, k]).sort((a, b) => b[0] - a[0]);
    const val = s.v ? sel.filter(k => p[k] / Math.max(s.v[k], 1e-3) >= 1.25 && p[k] >= .2) : [];
    let type, why;
    if (sel.length === p.length) {
      type = "全通り"; why = `差が小さい混戦（${p.map(x => pct(x)).join("/")}）なので全部押さえ`;
    } else if (sel.length === 1) {
      const k = sel[0];
      if (p[k] >= .55) { type = "本命1点"; why = `${lab(k)}が${pct(p[k])}と抜けている`; }
      else if (p[k] >= .45) { type = "1点"; why = `${lab(k)}が${pct(p[k])}で優勢`; }
      else { type = "1点(要注意)"; why = `${lab(k)}は${pct(p[k])}と決め手に欠けるが、予算の都合で1点に絞った`; }
      if (k !== order[0][1]) why += `（確率1位の${lab(order[0][1])}ではなく、人気薄で妙味のある${lab(k)}を選択）`;
    } else {
      const out = [...Array(p.length).keys()].filter(k => !sel.includes(k));
      type = isG ? `${sel.length}点` : "ダブル";
      why = `${sel.map(lab).join("・")}で${pct(cov)}をカバー。${out.map(lab).join("・")}（${out.map(k => pct(p[k])).join("/")}）は切り`;
    }
    if (s.m) { const mk = amax(s.m);
      if (!sel.includes(mk)) why += `。市場（WINNER）は${lab(mk)}を${pct(s.m[mk])}で最有力と見ている点に注意`;
      else if (sel.length === 1 && s.m[mk] >= .5) why += `。市場も${pct(s.m[mk])}で同じ見立て`; }
    if (s.v && !isG) {
      const maj = s.v.indexOf(Math.max(...s.v));
      if (!sel.includes(maj) && s.v[maj] >= .45) why += `。toto投票の${pct(s.v[maj])}が推す${lab(maj)}を外す逆張り`;
    }
    if (val.length) why += `。${val.map(lab).join("・")}は投票率より予想が高く妙味あり`;
    if (!isG && (s.r.susp_h || s.r.susp_a)) why += `。出場停止 ${s.r.home}${s.r.susp_h}人・${s.r.away}${s.r.susp_a}人`;
    return {i, s, sel, cov, type, why, risk: sel.length === 1 && sel.length < p.length ? 1 - cov : 0};
  });
  const singles = items.filter(x => x.sel.length === 1 && x.sel.length < x.s.p.length);
  const multi = items.filter(x => x.sel.length > 1);
  const weak = singles.filter(x => x.risk > .5).sort((a, b) => b.risk - a.risk).slice(0, 2);
  const lines = [];
  lines.push(`${T.units}口（${(T.units * 100).toLocaleString()}円）で、全${slots.length}${isG ? "枠" : "試合"}が当たる確率は約${pct(T.hit, T.hit < .01 ? 2 : 1)}（${oneIn(T.hit)}）。`);
  if (multi.length) lines.push(`混戦の${multi.map(x => isG ? x.s.key : "No." + x.s.r.no).join("・")}に予算を回し` +

    if (T2.hit > T.hit * 1.3) lines.push(`予算を${nb.toLocaleString()}円にすると、的中確率は${pct(T.hit, 1)} → ${pct(T2.hit, 1)}。`); }

    <p class="advsum">${lines.map(esc).join("")}</p>

function syncResults() {
  if (!D) return;
  (D.reviews || []).forEach(V => {
    RES[V.summary.round + "|" + V.kind] = {actual: V.rows.map(r => r.actual ?? null), complete: !!V.summary.complete};
  });

}

// 当たり外れ：試合ごとに『選んだ中に結果があるか』を数え、口ごとの外れ数の分布から等級別の当たり口数を出す
function judge(t) {
  const R = RES[t.round + "|" + t.kind], n = t.picks.length, g = (GRADES[t.kind] || ["1等"]).length;
  if (!R || R.actual.length !== n) return {state: "wait", text: "結果待ち", cells: t.picks.map(() => null), known: 0, n, miss: 0};
  let poly = [1], miss = 0, known = 0;
  const cells = t.picks.map((p, i) => {
    const a = R.actual[i];
    let c, w, st;
    if (a == null) {
      if (!R.complete) return null;
      c = p.length; w = 0; st = "void";              // 中止などで結果なし → 全的中扱い
    } else {
      known++; c = p.includes(a) ? 1 : 0; w = p.length - c; st = c ? "hit" : "miss"; if (!c) miss++;
    }
    const np = new Array(poly.length + 1).fill(0);
    poly.forEach((v, j) => { np[j] += v * c; np[j + 1] += v * w; });
    poly = np;
    return st;
  });
  if (R.complete || known === n) {
    const names = GRADES[t.kind] || ["1等"];
    const wins = names.map((nm, j) => ({nm, n: poly[j] || 0})).filter(x => x.n > 0);
    return wins.length ? {state: "win", wins, text: "的中 " + wins.map(x => `${x.nm}${x.n}口`).join("・"), cells, known, n, miss}
                       : {state: "lose", text: `外れ（${miss}か所）`, cells, known, n, miss};
  }
  if (miss >= g) return {state: "lose", text: `外れ確定（${known}/${n}確定・${miss}か所外れ）`, cells, known, n, miss};
  return {state: "wait", text: `判定待ち（${known}/${n}確定・${miss ? miss + "か所外れ" : "ここまで全的中"}）`, cells, known, n, miss};
}

  const sv = $("#bSave"); if (sv) sv.onclick = () => {
    const slots = slotsOf(K);
    BUY.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), round: K.round, kind: K.kind,
              created: new Date().toISOString(), picks: DRAFT.picks.map(p => [...p]),
              keys: slots.map(s => s.key), memo: DRAFT.memo || "", payout: null});
    saveBuy(); DRAFT = null; render(); toast("記録しました"); };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if (!confirm("この購入記録を削除しますか？")) return;
    BUY = BUY.filter(t => t.id !== b.dataset.del); saveBuy(); render(); });
  document.querySelectorAll("input.pay").forEach(i => i.onchange = () => {
    const t = BUY.find(x => x.id === i.dataset.id);
    if (t) { t.payout = i.value === "" ? null : +i.value; saveBuy(); render(); } });
  const ex = $("#bExp"); if (ex) ex.onclick = async () => {
    const txt = JSON.stringify(BUY);
    try { await navigator.clipboard.writeText(txt); toast("コピーしました（メモ帳などに保存してください）"); }
    catch (e) { prompt("この文字列を保存してください", txt); } };
  const im = $("#bImp"); if (im) im.onclick = () => {
    const s = prompt("バックアップの文字列を貼り付けてください（今の記録に追加されます）");
    if (!s) return;
    try { const arr = JSON.parse(s), ids = new Set(BUY.map(t => t.id)); let n = 0;
      arr.forEach(t => { if (t && t.id && Array.isArray(t.picks) && !ids.has(t.id)) { BUY.push(t); n++; } });
      saveBuy(); render(); toast(`${n}件を復元しました`); }
    catch (e) { toast("読み込めませんでした"); } };
}

// ================= 振り返り =================
function lessonCard(ls) {
  if (!ls) return `<div class="card"><h3>この回から学んだこと</h3><p class="desc" style="margin:0">全試合の結果が出そろうと、外れの分析と次回への反映がここに表示されます。</p></div>`;
  const tags = (ls.tags || []).map(t => `<span class="badge b-ng">${esc(t.name)} ${t.n}</span>`).join("");
  const checks = (ls.checks || []).map(c => `<div class="chk"><b>${esc(c.tag)}（${c.n}試合）</b><span>累積で確認: ${esc(c.check)}</span><em>→ ${esc(c.verdict)}</em></div>`).join("");
  const eff = (ls.effects || []).map(e => `No.${e.no} ${esc(e.match)}：${esc(e.feat)}で${e.out}を${sgn(e.pt)}pt`).join("<br>");
  return `<div class="card lesson"><h3>第${ls.round}回から学んだこと</h3>
    <p class="desc">${ls.at} 分析。本命 ${ls.hits}/${ls.known} 的中${ls.draws != null ? `・引き分け ${ls.draws}試合（想定 ${ls.exp_draws}）` : ""}${ls.mk_n ? `・市場の1番人気どおり ${ls.mk_hits}/${ls.mk_n}` : ""}</p>
    <div class="step"><span class="sn">1</span><div><b>外れの原因（候補）</b><div class="tags">${tags || "<span class='desc'>外れなし</span>"}</div></div></div>
    <div class="step"><span class="sn">2</span><div><b>累積データで確かめた結果</b>${checks || "<p class='desc'>確認対象なし</p>"}</div></div>
    <div class="step"><span class="sn">3</span><div><b>予想の作り方の変更</b><ul style="margin:4px 0 0;padding-left:1.1em">${(ls.changes || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul></div></div>
    <div class="step"><span class="sn">4</span><div><b>次回の予想への反映</b><br>${eff || "<span class='desc'>補正で2pt以上動いた試合はありません</span>"}</div></div>
  </div>`;
}

function myTicketsCard(round, kind) {

  return `<div class="card"><h3>あなたの購入（${mine.length}件）</h3>${mine.map(t => ticketBlock(t, false)).join("")}</div>`;
}

        <div class="vs">

function teamsView() {
  const lgs = ["all", ...new Set(D.ratings.map(r => r.lg).filter(x => x !== "-"))].sort();
  const q = S.q.trim();
  const rows = D.ratings.filter(r => (S.lg === "all" || r.lg === S.lg) && (!q || r.team.includes(q)));
  const mx = Math.max(...D.ratings.map(r => r.att)), mxd = Math.max(...D.ratings.map(r => r.def));
  let h = `<div class="card"><h3>チーム力ランキング</h3><p class="desc">Elo＝総合的な強さ。攻撃＝得点の倍率、守備＝失点の倍率（小さいほど堅い）。ずれ＝最近『予想より何勝点多く取っているか』。</p>
    <div class="chips" id="lgchips">${lgs.map(l => `<button data-lg="${l}" class="${S.lg === l ? "on" : ""}">${l === "all" ? "すべて" : l}</button>`).join("")}</div>
    <input class="search" id="q" placeholder="チーム名で検索" value="${esc(S.q)}">
    <table class="t num"><tr><th>#</th><th style="text-align:left">チーム</th><th>Elo</th><th>攻撃</th><th>守備</th><th>ずれ</th></tr>`;
  rows.forEach(r => {
    h += `<tr><td style="color:var(--sub)">${S.lg === "all" ? r.lg + "-" : ""}${r.rank}</td><td style="text-align:left;font-weight:700">${esc(r.team)}</td><td>${r.elo}</td>
      <td><div style="display:flex;align-items:center;gap:5px;justify-content:flex-end">${r.att.toFixed(2)}<div class="mini" style="width:34px"><i style="width:${r.att / mx * 100}%;background:var(--c1)"></i></div></div></td>
      <td><div style="display:flex;align-items:center;gap:5px;justify-content:flex-end">${r.def.toFixed(2)}<div class="mini" style="width:34px"><i style="width:${Math.min(100, (1 - r.def / mxd) * 100 + 15)}%;background:var(--ok)"></i></div></div></td>

  });
  return h + `</table>${rows.length ? "" : `<p class="desc">該当なし</p>`}</div>`;

    <p class="desc">WINNERのスコア別オッズは試合開始10分前まで動く『市場の予想』。全Ｊリーグ試合で記録し、結果と照らして予想に混ぜる重みを学習します。</p>
    <div class="status num">
      <div><span>オッズを記録した試合</span><b>${mk.rec || 0}</b><span>うち結果あり ${mk.n || 0}</span></div>
      <div><span>予想への反映</span><b>${mk.a ? `重み ${mk.a}` : "まだ反映なし"}</b><span>${mk.a ? `得点予想は重み ${mk.ag}` : `${mk.need}試合で検証開始`}</span></div>
    </div>
    <div class="prog"><i style="width:${pr * 100}%"></i></div>
    <p class="desc" style="margin:0 0 8px">学習開始まで ${mk.n || 0}/${mk.need} 試合。出場停止の記録 ${L.susp_n || 0}件（補正『出場停止』として毎回検証）。</p>`;
  if (ev && ev.n) h += `<table class="t num"><tr><th>比較（${ev.n}試合）</th><th>対数損失</th><th>RPS</th><th>本命的中</th></tr>
    <tr><td>このサイトの予想</td><td>${ev.ll_model.toFixed(3)}</td><td>${ev.rps_model.toFixed(3)}</td><td>${pct(ev.acc_model, 1)}</td></tr>
    <tr><td>市場（直前）</td><td>${ev.ll_market.toFixed(3)}</td><td>${ev.rps_market.toFixed(3)}</td><td>${pct(ev.acc_market, 1)}</td></tr>

    <p class="desc" style="margin:6px 0 0">数値は小さいほど良い（本命的中は大きいほど良い）。</p>`;
  return h + `</div>`;
}

  const lvCls = {"確定":"b-ng","監視中":"b-close"};
  const tr = (L.track || []).filter(t => t.kind === "toto" && t.known);
  const fd = (L.findings || []), fa = (L.findings_after || []);
  let h = marketCard() + `<div class="card"><h3>診断：予想が外れやすい傾向</h3>

  if (tr.length) {
    h += `<div class="card"><h3>回ごとの成績（toto）</h3><p class="desc">本命の的中数の推移。</p>
      <div class="track">${tr.map(t => `<div><span class="num">${t.hits}/${t.known}</span><i style="height:${t.hits / t.known * 70}%;background:${t.ll != null && t.ll_base != null && t.ll < t.ll_base ? "var(--ok)" : "var(--acc)"}"></i><span>${t.round}${t.reconstructed ? "*" : ""}</span></div>`).join("")}</div>
      <p class="desc" style="margin-top:6px">緑＝確率の当てはまりが平均より良かった回。*＝当時のデータで再現した予想。</p></div>`;
  }
  h += learnCard();
  const bt = D.by_tier || {};
  h += `<div class="card"><h3>予想の答え合わせ（時間順の検証）</h3><p class="desc">${D.test}＋toto対象試合を、それ以前のデータだけで予想した成績。</p>

    ${D.backtest.map(b => `<tr class="${b === best ? "best" : ""}"><td>${b.name}</td><td>${b.ll.toFixed(3)}</td><td>${(b.rps ?? 0).toFixed(3)}</td><td>${b.brier.toFixed(3)}</td><td>${pct(b.acc, 1)}</td></tr>`).join("")}</table>

  <div class="card"><h3>データの状態</h3>
    <div class="status num">
      <div><span>最新の試合結果</span><b style="color:${fresh[1]}">${D.res_to}</b><span>${D.lag}日前・${fresh[0]}</span></div>

      <div><span>ホームの得点倍率</span><b>${D.home_adv}倍</b><span>ホームが有利な度合い</span></div>
      <div><span>モデルの配分</span><b>ポアソン${pct(D.w_poi)}</b><span>残りはElo</span></div>
    </div>
    <div class="spark">${D.monthly.map(m => `<div title="${m[0]}: ${m[1]}試合" style="height:${m[1] / mm * 100}%"></div>`).join("")}</div>
    <div class="sparkx"><span>${D.monthly[0]?.[0] ?? ""}</span><span>月別の試合数</span><span>${D.monthly.at(-1)?.[0] ?? ""}</span></div>
  </div>
  <div class="card"><details><summary style="font-size:.85rem">更新ログ</summary><pre class="log">${esc(D.logs.join("\n"))}</pre></details></div>`;
  return h;
}

function bind() {
  document.querySelectorAll(".ktabs button[data-k]").forEach(b => b.onclick = () => { S.kind = +b.dataset.k; save(); render(); });
  document.querySelectorAll(".ktabs button[data-rk]").forEach(b => b.onclick = () => { S.rkind = +b.dataset.rk; save(); render(); });
  document.querySelectorAll("#bseg button").forEach(b => b.onclick = () => { S.budget = +b.dataset.b; save(); render(); });
  document.querySelectorAll("#aseg button").forEach(b => b.onclick = () => { S.alpha = +b.dataset.a; save(); render(); });
  document.querySelectorAll(".m[data-id]").forEach(c => c.onclick = () => { const id = c.dataset.id;
    open.has(id) ? open.delete(id) : open.add(id); c.classList.toggle("open"); });
  document.querySelectorAll("#lgchips button").forEach(b => b.onclick = () => { S.lg = b.dataset.lg; save(); render(); });
  const q = $("#q"); if (q) q.oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  const mo = $("#missOnly"); if (mo) mo.onclick = () => { S.missOnly = !S.missOnly; save(); render(); };
  const ts = $("#toSheet"); if (ts) ts.onclick = () => { S.view = S.view === "sheet" ? "pred" : "sheet"; save(); render(); };
  const tb = $("#toBuy"); if (tb) tb.onclick = () => { const K = D.kinds[S.kind];
    DRAFT = {key: K.round + "|" + K.kind, picks: LAST_T.picks.map(p => [...p]), memo: ""};
    S.view = "buy"; save(); render(); scrollTo(0, 0); toast("おすすめ買い目を入れました。実際に買った内容に直して記録"); };
  if (S.view === "buy" || S.view === "review") bindBuy();
  const cp = $("#copy"); if (cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(COPY_TEXT); toast("コピーしました"); } catch (e) { toast("コピーできませんでした"); } };
}
setInterval(() => { if (D) header(); }, 60000);
</script>
</body>
